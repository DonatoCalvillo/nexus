name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 1.0.0). Used only for workflow_dispatch."
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.TrimStart("v")
          } else {
            $version = "${{ inputs.version }}"
            $tag = "v$version"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version is empty"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version=$version tag=$tag"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: |
          msbuild Nexus\Nexus.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /m

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }
          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DMyAppURL=https://github.com/${{ github.repository }}" `
            "/DMyAppPublisher=${{ github.repository_owner }}" `
            installer\Nexus.iss

      - name: Stage portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = "dist\portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "x64\Release\Nexus.exe" "$stage\Nexus.exe"
          Copy-Item "LICENSE" "$stage\LICENSE"
          Copy-Item "README.md" "$stage\README.md"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\Nexus-$version-windows-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nexus ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/NexusSetup-${{ steps.version.outputs.version }}.exe
            dist/Nexus-${{ steps.version.outputs.version }}-windows-x64.zip
            x64/Release/Nexus.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
