name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Release x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "x64\Release"
          $intDir = Join-Path $env:GITHUB_WORKSPACE "x64\Release\obj"
          New-Item -ItemType Directory -Force -Path $outDir, $intDir | Out-Null
          msbuild Nexus\Nexus.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            "/p:OutDir=$($outDir -replace '\\','/')/" `
            "/p:IntDir=$($intDir -replace '\\','/')/" `
            /m
          if (-not (Test-Path (Join-Path $outDir "Nexus.exe"))) {
            throw "Nexus.exe was not produced at $outDir"
          }

      - name: Build and run calculator tests
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "x64\Release"
          $intDir = Join-Path $env:GITHUB_WORKSPACE "x64\Release\obj\Nexus.Tests"
          New-Item -ItemType Directory -Force -Path $outDir, $intDir | Out-Null
          msbuild tests\Nexus.Tests.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            "/p:OutDir=$($outDir -replace '\\','/')/" `
            "/p:IntDir=$($intDir -replace '\\','/')/" `
            /m
          $testExe = Join-Path $outDir "Nexus.Tests.exe"
          if (-not (Test-Path $testExe)) {
            throw "Nexus.Tests.exe was not produced at $outDir"
          }
          & $testExe
          if ($LASTEXITCODE -ne 0) {
            throw "Calculator tests failed with exit code $LASTEXITCODE"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-windows-x64
          path: x64/Release/Nexus.exe
          if-no-files-found: error
